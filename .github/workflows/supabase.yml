# US-03 / MAIN-03: database migrations and Edge Functions.
#   main → staging automatically; production waits for a reviewer on the "production"
#   environment (Settings → Environments → production → Required reviewers: tech lead).
# Per environment: secrets SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD; variable SUPABASE_PROJECT_ID.
# Function secrets (RESEND_API_KEY, CRON_SECRET, …) are set once with `supabase secrets set`.
name: Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$PROJECT_ID"

      - name: Apply migrations and reference data
        run: supabase db push --include-seed

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$PROJECT_ID"

  production:
    name: Deploy to production
    needs: staging
    runs-on: ubuntu-latest
    # The environment's required reviewers make this job wait for a manual approval.
    environment: production
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$PROJECT_ID"

      - name: Show pending migrations
        run: supabase migration list

      - name: Apply migrations and reference data
        run: supabase db push --include-seed

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$PROJECT_ID"
