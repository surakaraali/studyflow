# US-02: every change merged to main reaches internal testers on the "preview" channel.
#   - JavaScript changes: an EAS Update (over the air) on the preview channel.
#   - Native changes: a new internal build (queued, not awaited).
# Needs the repository secret EXPO_TOKEN and the "staging" environment variables below
# (public values only: the anon key is public by design, RLS protects the data).
name: Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_REVENUECAT_IOS_KEY: ${{ vars.EXPO_PUBLIC_REVENUECAT_IOS_KEY }}
      EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ vars.EXPO_PUBLIC_REVENUECAT_ANDROID_KEY }}
      EXPO_PUBLIC_CONSENT_WEB_URL: ${{ vars.EXPO_PUBLIC_CONSENT_WEB_URL }}
      EXPO_PUBLIC_SUPPORT_EMAIL: ${{ vars.EXPO_PUBLIC_SUPPORT_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install
        run: npm ci

      - name: Secret scan before publishing
        run: node scripts/check-secrets.mjs

      - name: OTA update (preview channel)
        env:
          # Passed through env so a commit message can never run as a command.
          MESSAGE: ${{ github.event.head_commit.message || 'manual preview' }}
        run: eas update --channel preview --message "$MESSAGE" --non-interactive

      - name: Internal build (preview profile)
        # iOS first (R1). Use --platform all once Android starts (R2a).
        run: eas build --profile preview --platform ios --non-interactive --no-wait
