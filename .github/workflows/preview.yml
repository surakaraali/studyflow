# US-02: every change merged to main reaches internal testers on the "preview" channel.
#   - JavaScript changes: an EAS Update (over the air) on the preview channel.
#   - Native changes: a new internal build (queued, not awaited).
# Needs the repository secret EXPO_TOKEN and the repository variable EAS_PROJECT_ID (from
# `eas init`). The app's EXPO_PUBLIC_* values come from the Expo "preview" environment
# (`eas env:create --environment preview ...`), not from GitHub: since SDK 55 `eas update`
# reads them from there when it gets --environment.
name: Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preview:
    # Skipped (not failed) until EAS is set up (`eas init`, EXPO_TOKEN): then set the repository
    # variable EAS_PREVIEW=true under Settings → Secrets and variables → Actions → Variables.
    if: vars.EAS_PREVIEW == 'true'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    env:
      # app.config.ts reads it for the update URL and the project id.
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install
        run: npm ci

      - name: Secret scan before publishing
        run: node scripts/check-secrets.mjs

      - name: OTA update (preview channel)
        env:
          # Passed through env so a commit message can never run as a command.
          MESSAGE: ${{ github.event.head_commit.message || 'manual preview' }}
        run: eas update --channel preview --environment preview --message "$MESSAGE" --non-interactive

      - name: Internal build (preview profile)
        # iOS first (R1). Use --platform all once Android starts (R2a).
        run: eas build --profile preview --platform ios --non-interactive --no-wait
